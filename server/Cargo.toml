[package]
name = "server"
version = "0.1.0"
edition = "2024"

[lints]
workspace = true

[dependencies]
anyhow = "1.0"
arc-swap = "1.9.5"
axum = "0.8.9"
futures = "0.3.34"
image = { version = "0.25.10", default-features = false, features = ["png"] }
leptos.workspace = true
leptos_axum = "0.8.10"
leptos_router.workspace = true
leptos-use-signal-debounce-throttle.workspace = true
leptos-use-websocket.workspace = true
leptos-use-timestamp.workspace = true
leptos-use-storage.workspace = true
log = "0.4.35"
notify = "9.0.0"
reqwest = "0.13.5"
serde.workspace = true
tokio = { version = "1", features = ["rt-multi-thread"] }
tracing-subscriber = "0.3.23"
yaml_serde = "0.10.7"

common.path = "../common"
shared.path = "../shared"

[features]
ssr = [
    "leptos/ssr",
    "leptos_router/ssr",
    "leptos-use-signal-debounce-throttle/ssr",
    "leptos-use-websocket/ssr",
    "leptos-use-timestamp/ssr",
    "leptos-use-storage/ssr",
]
