[package]
name = "play"
version = "0.1.0"
edition = "2024"

[lints]
workspace = true

[dependencies]
chat.path = "../../components/chat"
common.path = "../../common"
flume = "0.12.0"
gloo-file = { version = "0.4.1", features = ["futures"] }
gloo-net.workspace = true
indexmap.workspace = true
itertools = "0.15.0"
jiff.workspace = true
leptos.workspace = true
leptos_meta.workspace = true
leptos_router.workspace = true
leptos-use-signal-debounce-throttle.workspace = true
leptos-use-websocket.workspace = true
leptos-use-storage.workspace = true
locations.path = "../../components/locations"
reactive_stores = "0.4.4"
serde.workspace = true
serde_json = "1.0"
serde-wasm-bindgen.workspace = true
strum = { version = "0.28", features = ["derive"] }
strsim = "0.11.1"
stylance.workspace = true
thiserror = "2.0"
wasm-bindgen.workspace = true

[build-dependencies]
stylance-cli = "0.8.4"

[package.metadata.stylance]
output_file = "../../assets/css/play.css"
